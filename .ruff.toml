# Ruff config (TOML for .ruff.toml)
line-length = 120
target-version = "py311"
respect-gitignore = true
extend-exclude = ["venv", ".venv", "instance", "__pycache__", "uploads", "node_modules"]

[lint]
select = ["E", "F", "I", "B"]
ignore = []

[format]
# Ruff 0.16 also formats Python blocks in Markdown; doc snippets stay as written.
exclude = ["*.md"]
