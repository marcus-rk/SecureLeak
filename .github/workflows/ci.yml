name: CI

# Overview
# This workflow is optimized for fast feedback while keeping results easy to
# read. A small "changes" job decides what is relevant, then up to 3 focused
# jobs run:
#  - Python • Ruff: lint + format check Python
#  - Security • Bandit & pip-audit: basic SAST and dependency CVEs
#  - Tests • Pytest: full test suite
#
# Key techniques used here:
#  - Path filtering runs once in the "changes" job; the other jobs use its
#    outputs in a job-level `if:`, so irrelevant jobs are skipped entirely.
#    A skipped job still counts as passing for required checks.
#  - Every filter includes the workflow files, so a CI change runs all jobs.
#  - Use setup-python's built-in pip cache for tool installs
#  - Keep steps minimal and pinned for reproducibility and cold-start speed
#  - Check-only: tools never rewrite files, and a failing step fails
#    natively so it shows red in the UI.

# Push only on main: a PR branch is already covered by pull_request, and
# without this filter every PR commit would run CI twice (the refs differ,
# so concurrency does not dedupe them).
on:
  push:
    branches: [main]
  pull_request:

# Concurrency ensures only the latest run for a branch/PR is active.
# This saves CI minutes and keeps signal relevant when pushing quickly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege - workflows default to broad permissions.
permissions:
  contents: read

# Use bash for all run steps
defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.filter.outputs.python }}
      security: ${{ steps.filter.outputs.security }}
      tests: ${{ steps.filter.outputs.tests }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        # Checkout is required so tools can read files. v4 is the current
        # major and is well-cached on GitHub runners.

      # One paths-filter run for the whole workflow. Each filter becomes a
      # job output that the jobs below branch on.
      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        with:
          filters: |
            python:
              - '**/*.py'
              - '.ruff.toml'
              - '.github/workflows/**'
            security:
              - 'requirements*.txt'
              - '**/*.py'
              - '.github/workflows/**'
            tests:
              - '**/*.py'
              - 'templates/**'
              - 'static/**'
              - 'pytest.ini'
              - 'requirements*.txt'
              - '.github/workflows/**'

  python-lint:
    name: Python • Ruff
    needs: changes
    # Run only when Python files, Ruff config or the workflow changed
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Built-in pip cache for faster installs
      # The cache reuses downloaded wheels between runs to speed up pip installs.
      # Sticking to one Python version maximizes cache hit rate.
      - name: Set up Python 3.11 (pip cache)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"
          
      # Pin versions for reproducibility and stable annotations.
      # Tip: update periodically to pick up new rules/perf.
      # Keep this version in sync with ruff in requirements-dev.txt.
      - name: Install Ruff (pinned)
        run: pip install "ruff==0.5.7"

      # Ruff never rewrites files in CI. These are the same check-only
      # commands listed in AGENTS.md, so a local pass means a CI pass.
      - name: Ruff lint
        id: ruff_lint
        run: ruff check . --output-format=github
        # ruff check (no --fix) reports lint errors as GitHub annotations.

      - name: Ruff format check
        id: ruff_format
        if: ${{ !cancelled() }}
        run: ruff format --check .
        # Fails if any file is not formatted. !cancelled() runs it even when
        # lint failed, so one push shows lint errors and formatting drift
        # together.

      - name: Summary (Python • Ruff)
        if: ${{ !cancelled() }}
        run: |
          echo "## Python • Ruff" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ruff lint: ${{ steps.ruff_lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ruff format: ${{ steps.ruff_format.outcome }}" >> "$GITHUB_STEP_SUMMARY"
        # Report only: the check steps above already set the job result.

  security-audit:
    name: Security • Bandit & pip-audit
    needs: changes
    # Run on Python, dependency or workflow changes
    if: needs.changes.outputs.security == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11 (pip cache)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security tools (pinned)
        run: pip install "bandit==1.7.8" "pip-audit==2.7.3"
        # Pin for consistent findings and faster cold starts.

      - name: Bandit (SAST)
        id: bandit
        run: |
          bandit -q -r . \
            --severity-level medium \
            --confidence-level medium \
            -x venv,.venv,instance,__pycache__
        # Bandit scans Python code for common security issues.
        # -q: quiet output    -r: recursive
        # We set minimum severity/confidence to "medium" to reduce noise.
        # Exclusions skip virtualenvs, runtime instance data, and caches.

      - name: pip-audit (dependency CVEs)
        id: pip_audit
        if: ${{ !cancelled() }}
        run: pip-audit -r requirements.txt -r requirements-dev.txt
        # Checks requirement versions against known CVEs.
        # !cancelled() runs it even when Bandit failed, so both results show.

      - name: Summary (Security)
        if: ${{ !cancelled() }}
        run: |
          echo "## Security • Bandit & pip-audit" >> "$GITHUB_STEP_SUMMARY"
          echo "- Bandit: ${{ steps.bandit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- pip-audit: ${{ steps.pip_audit.outcome }}" >> "$GITHUB_STEP_SUMMARY"
        # Report only: the job fails if Bandit or pip-audit failed.

  tests:
    name: Tests • Pytest
    needs: changes
    # Run only when code, templates, static files, test config or the
    # workflow changed
    if: needs.changes.outputs.tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.11 (pip cache)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run pytest (full suite)
        id: pytest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest

      - name: Summary (Tests • Pytest)
        if: ${{ !cancelled() }}
        run: |
          echo "## Tests • Pytest" >> "$GITHUB_STEP_SUMMARY"
          echo "- pytest: ${{ steps.pytest.outcome }}" >> "$GITHUB_STEP_SUMMARY"
